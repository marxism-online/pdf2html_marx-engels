name: Build executables

on:
  push:
    branches: [main, "agent/heuristics"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfminer.six Pillow Jinja2 pyinstaller

      - name: Build executable
        run: pyinstaller kmfe-pdf2html.spec

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2html-windows
          path: dist/kmfe-pdf2html.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfminer.six Pillow Jinja2 pyinstaller

      - name: Build executable
        run: pyinstaller kmfe-pdf2html.spec

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2html-linux
          path: dist/kmfe-pdf2html
          retention-days: 30

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf2html-windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: pdf2html-linux
          path: dist/linux

      - name: Rename files with version
        run: |
          mv dist/windows/kmfe-pdf2html.exe "dist/windows/kmfe-pdf2html-build_0.${{ github.run_number }}.exe"
          mv dist/linux/kmfe-pdf2html "dist/linux/kmfe-pdf2html-linux-build_0.${{ github.run_number }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: v0.${{ github.run_number }}
          files: |
            dist/windows/kmfe-pdf2html-build_0.${{ github.run_number }}.exe
            dist/linux/kmfe-pdf2html-linux-build_0.${{ github.run_number }}
