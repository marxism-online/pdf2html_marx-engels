name: Build Windows executable

on:
  push:
    branches: [main, "agent/heuristics"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfminer.six Pillow Jinja2 pyinstaller

      - name: Build executable
        run: pyinstaller pdf2html.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf2html-windows
          path: dist/pdf2html.exe
          retention-days: 30
