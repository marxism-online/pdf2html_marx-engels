name: Build executables

on:
  push:
    branches: [main, "agent/heuristics", "feature/gui"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfminer.six Pillow Jinja2 pyinstaller customtkinter

      - name: Build CLI executable
        run: pyinstaller kmfe-pdf2html.spec

      - name: Build GUI executable
        run: pyinstaller kmfe-pdf2html-gui.spec

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2html-windows
          path: |
            dist/kmfe-pdf2html.exe
            dist/kmfe-pdf2html-gui.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-tk
          pip install pdfminer.six Pillow Jinja2 pyinstaller customtkinter

      - name: Build CLI executable
        run: pyinstaller kmfe-pdf2html.spec

      - name: Build GUI executable
        run: pyinstaller kmfe-pdf2html-gui.spec

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2html-linux
          path: |
            dist/kmfe-pdf2html
            dist/kmfe-pdf2html-gui
          retention-days: 30

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pdf2html-windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: pdf2html-linux
          path: dist/linux

      - name: Pack Chrome extension
        run: |
          cd chrome-extension
          zip -r "../dist/pdf2html-pager-chrome-extension.zip" . -x "*.md"

      - name: Rename files with version
        run: |
          mv dist/windows/kmfe-pdf2html.exe "dist/windows/kmfe-pdf2html-build_1.${{ github.run_number }}.exe"
          mv dist/windows/kmfe-pdf2html-gui.exe "dist/windows/kmfe-pdf2html-gui-build_1.${{ github.run_number }}.exe"
          mv dist/linux/kmfe-pdf2html "dist/linux/kmfe-pdf2html-linux-build_1.${{ github.run_number }}"
          mv dist/linux/kmfe-pdf2html-gui "dist/linux/kmfe-pdf2html-gui-linux-build_1.${{ github.run_number }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: v1.${{ github.run_number }}
          files: |
            dist/windows/kmfe-pdf2html-build_1.${{ github.run_number }}.exe
            dist/windows/kmfe-pdf2html-gui-build_1.${{ github.run_number }}.exe
            dist/linux/kmfe-pdf2html-linux-build_1.${{ github.run_number }}
            dist/linux/kmfe-pdf2html-gui-linux-build_1.${{ github.run_number }}
            dist/pdf2html-pager-chrome-extension.zip
